<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Create event | ROSE</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./create-event.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="masthead shell">
    <a class="brand" href="./index.html" aria-label="ROSE community events"><span class="brand-mark" aria-hidden="true">R</span><span><strong>ROSE</strong><small>Community event access</small></span></a>
    <nav class="header-nav" aria-label="Main navigation"><a class="nav-link" href="./index.html">Events</a><div id="account" class="account"><a class="button button-small" href="./login.html">Log in <span aria-hidden="true">↗</span></a></div></nav>
  </header>
  <main id="main" class="shell create-main" tabindex="-1">
    <div id="auth-notice" class="notice" role="status" hidden></div>
    <section class="login-card create-card" aria-labelledby="create-heading">
      <p class="eyebrow">BRING PEOPLE TOGETHER</p>
      <h1 id="create-heading">Create event</h1>
      <p id="create-timezone" class="muted"></p>
      <p id="login-prompt" class="notice">Please <a href="./login.html">log in</a> and verify your account before creating an event.</p>
      <div id="create-progress" class="notice" role="status" aria-live="polite" hidden></div>
      <form id="create-event-form">
        <fieldset id="event-fields" disabled>
          <legend class="muted">Event details</legend>
          <div class="field"><label for="title">Event title</label><input id="title" name="title" type="text" required maxlength="255"></div>
          <div class="field"><label for="overview">Overview (optional)</label><textarea id="overview" name="overview" rows="4"></textarea></div>
          <div class="field"><label for="location">Location</label><input id="location" name="location" type="text" required maxlength="255"></div>
          <div class="field"><label for="start_time">Start date and time</label><input id="start_time" name="start_time" type="datetime-local" required aria-describedby="create-timezone"></div>
          <div class="field"><label for="end_time">End date and time</label><input id="end_time" name="end_time" type="datetime-local" required aria-describedby="create-timezone"></div>
          <div class="field"><label for="online_quota">Online quota</label><input id="online_quota" name="online_quota" type="number" required min="0" max="2147483647" step="1" value="0"></div>
          <div class="field"><label for="offline_quota">Offline quota</label><input id="offline_quota" name="offline_quota" type="number" required min="0" max="2147483647" step="1" value="0"></div>
          <button class="button" type="submit">Create event</button>
        </fieldset>
        <a class="back-link" href="./index.html">Cancel</a>
      </form>
      <div id="create-result" hidden><h2 id="created-title"></h2><p>Public ID: <span id="created-id"></span></p></div>
      <a class="back-link" href="./index.html">Back to events</a>
    </section>
    <noscript><p class="notice">Enable JavaScript to create an event.</p></noscript>
  </main>
</body>
</html>
